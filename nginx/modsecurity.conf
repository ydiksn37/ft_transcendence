# ──────────────────────────────────────────────────────────────
#  ft_transcendence — ModSecurity 設定オーバーライド
#  OWASP CRS の設定を上書き/追記する
# ──────────────────────────────────────────────────────────────

# ── WebSocket / Socket.IO は WAF スキャン対象外 ───────────────
# ゲームトラフィックの誤検知を防ぐため、Socket.IO パスを除外
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off,\
     msg:'Socket.IO WebSocket - Skip WAF inspection'"

# ── Swagger UI へのアクセスを許可 ─────────────────────────────
SecRule REQUEST_URI "@beginsWith /api/docs" \
    "id:1003,phase:1,pass,nolog,ctl:ruleEngine=Off"

# ── 開発用ViteアセットのLFI誤検知だけを除外 ──────────────────
# `/@fs/` と `node_modules/` はViteが生成する同一originのJS import。
# APIやアプリの通常routeは検査対象のまま、Vite内部assetだけを除外する。
SecRule REQUEST_URI "@beginsWith /@" \
    "id:1004,phase:1,pass,nolog,ctl:ruleEngine=Off"
SecRule REQUEST_URI "@beginsWith /node_modules/.vite/" \
    "id:1005,phase:1,pass,nolog,ctl:ruleEngine=Off"
