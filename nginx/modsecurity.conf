# ──────────────────────────────────────────────────────────────
#  ft_transcendence — ModSecurity 設定オーバーライド
#  OWASP CRS の設定を上書き/追記する
# ──────────────────────────────────────────────────────────────

# 防御モードで起動
SecRuleEngine On

# リクエストボディを検査
SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 131072

# レスポンスボディは検査しない（パフォーマンス優先）
SecResponseBodyAccess Off

# 監査ログ
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

# デバッグログ（本番では 0 または 1 に）
SecDebugLogLevel 1

# ── WebSocket / Socket.IO は WAF スキャン対象外 ───────────────
# ゲームトラフィックの誤検知を防ぐため、Socket.IO パスを除外
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off,\
     msg:'Socket.IO WebSocket - Skip WAF inspection'"

# ── アップロードエンドポイントのボディサイズ緩和 ──────────────
SecRule REQUEST_URI "@beginsWith /api/users/me/avatar" \
    "id:1002,phase:1,pass,nolog,ctl:requestBodyLimit=5242880"

# ── Swagger UI へのアクセスを許可 ─────────────────────────────
SecRule REQUEST_URI "@beginsWith /api/docs" \
    "id:1003,phase:1,pass,nolog,ctl:ruleEngine=Off"

# ── SQLインジェクション検知強化 ───────────────────────────────
# CRS が既にカバーしているが、ゲームAPIの誤検知ルールをここで調整
# 例: ゲーム内容に含まれる特定パターンの除外

# ── IP ベースのレート制限 ─────────────────────────────────────
# (Nginx の limit_req との二重防御)
SecAction \
    "id:900110,\
     phase:1,\
     nolog,\
     pass,\
     t:none,\
     setvar:tx.inbound_anomaly_score_threshold=5,\
     setvar:tx.outbound_anomaly_score_threshold=4"
