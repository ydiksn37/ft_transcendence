services:
  # ─────────────────────────────────────────
  #  PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: transcendence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transcendence_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  HashiCorp Vault (dev モード)
  # ─────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.18
    container_name: transcendence_vault
    restart: unless-stopped
    command: vault server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  NestJS バックエンド
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: transcendence_backend
    restart: unless-stopped
    command: sh -c "npx prisma db push --accept-data-loss && npm run dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      VAULT_ADDR: "http://vault:8200"
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      OTP_EXPIRES_MINUTES: ${OTP_EXPIRES_MINUTES:-10}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AI_AGENT_PATH: /opt/ai-agent-dev/ai_agent
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro  # ホットリロード用
      - ./packages/shared/dist:/app/packages/shared/dist:ro # Socket共有型のホットリロード用
      - ./build/ai-agent-web:/opt/ai-agent-dev:ro   # C++ AIの開発用バイナリ
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  C++ AI 開発用コンパイラ
  #  初回だけイメージを作り、以後はソースとビルド成果物をmountする。
  # ─────────────────────────────────────────
  ai-compiler:
    profiles: ["tools"]
    image: ft_transcendence-ai-compiler:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: ai-toolchain
    working_dir: /src
    volumes:
      - ./apps/ai-agent:/src:ro
      - ./build/ai-agent-web:/build
    command: >-
      sh -c "cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release
      -DBUILD_TESTING=OFF && cmake --build /build --parallel --target ai_agent"
    network_mode: none

  # ─────────────────────────────────────────
  #  React フロントエンド (Vite dev server)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    container_name: transcendence_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_DEV_PROXY_TARGET: "http://backend:3000"
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src:ro  # ホットリロード用
      - ./packages/shared/src:/app/packages/shared/src:ro   # Vite alias用の共有Socket source
      - ./packages/shared/dist:/app/packages/shared/dist:ro # 型定義・production import用
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  Nginx (リバースプロキシ + 自己署名 SSL)
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_PORT:-8443}:8443"
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  transcendence_net:
    driver: bridge
