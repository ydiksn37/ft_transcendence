services:
  # ─────────────────────────────────────────
  #  PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: transcendence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: transcendence_redis
    restart: unless-stopped
    secrets:
      - redis_password
    command:
      - sh
      - -ec
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - redis_data:/data
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  HashiCorp Vault (server モード / file storage)
  #  初期化・秘密情報の同期は tools/vault-init.sh（make vault-init）で行う
  # ─────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.18
    container_name: transcendence_vault
    restart: unless-stopped
    command: vault server -config=/vault/config/config.hcl
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/file
    # vault status は unseal 済みの場合のみ exit 0
    healthcheck:
      test: ["CMD-SHELL", "vault status > /dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - transcendence_net

  vault-unsealer:
    image: hashicorp/vault:1.18
    container_name: transcendence_vault_unsealer
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/vault/unseal.sh"]
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_UNSEAL_KEY_FILE: /run/secrets/vault_unseal_key
    secrets:
      - vault_unseal_key
    volumes:
      - ./vault/unseal.sh:/vault/unseal.sh:ro
    depends_on:
      - vault
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  NestJS バックエンド
  # ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: transcendence_backend
    restart: unless-stopped
    # schema変更は `make migrate-dev name=...` でmigrationを作成する（db pushは使わない）
    command: sh -c "npm run db:generate && npx ts-node --transpile-only src/migrate.ts && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN_FILE: /run/secrets/vault_token
      VAULT_SECRET_PATH: secret/data/transcendence
      VAULT_REQUIRED: "true"
      MIGRATE_BASELINE_EXISTING: "true"
      FT_CALLBACK_URL: ${FT_CALLBACK_URL}
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AI_AGENT_PATH: /opt/ai-agent-dev/ai_agent
    secrets:
      - vault_token
    volumes:
      - ./apps/backend/src:/app/apps/backend/src:ro  # ホットリロード用
      - ./apps/backend/prisma:/app/apps/backend/prisma:ro # schema変更時のClient再生成用
      - ./packages/shared/dist:/app/packages/shared/dist:ro # Socket共有型のホットリロード用
      - ./build/ai-agent-web:/opt/ai-agent-dev:ro   # C++ AIの開発用バイナリ
      - uploads_data:/app/uploads
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  C++ AI 開発用コンパイラ
  #  初回だけイメージを作り、以後はソースとビルド成果物をmountする。
  # ─────────────────────────────────────────
  ai-compiler:
    profiles: ["tools"]
    image: ft_transcendence-ai-compiler:latest
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: ai-toolchain
    working_dir: /src
    volumes:
      - ./apps/ai-agent:/src:ro
      - ./build/ai-agent-web:/build
    command: >-
      sh -c "cmake -S /src -B /build -DCMAKE_BUILD_TYPE=Release
      -DBUILD_TESTING=OFF >/build/configure.log 2>&1 ||
      { status=$$?; cat /build/configure.log; exit $$status; };
      cmake --build /build --parallel --target ai_agent >/build/build.log 2>&1 ||
      { status=$$?; cat /build/build.log; exit $$status; };
      echo 'C++ web AI build complete: /build'"
    network_mode: none

  # ─────────────────────────────────────────
  #  React フロントエンド (production build)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
    container_name: transcendence_frontend
    restart: unless-stopped
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - transcendence_net

  # ─────────────────────────────────────────
  #  Nginx (リバースプロキシ + 自己署名 SSL)
  # ─────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    restart: unless-stopped
    environment:
      NGINX_HTTPS_PORT: ${NGINX_PORT:-8443}
      FRONTEND_UPSTREAM_PORT: 80
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_PORT:-8443}:8443"
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_net

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  vault_data:

# tools/vault-init.shが生成する。secrets/ はGit管理外
secrets:
  postgres_password:
    file: ./secrets/dev/postgres_password.txt
  redis_password:
    file: ./secrets/dev/redis_password.txt
  vault_token:
    file: ./secrets/dev/vault_token.txt
  vault_unseal_key:
    file: ./secrets/dev/vault_unseal_key.txt

networks:
  transcendence_net:
    driver: bridge
